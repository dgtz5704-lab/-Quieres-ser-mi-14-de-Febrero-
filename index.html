<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Feliz Cumpleaños Suegrita Verito</title>

<style>

/* ===== FONDO ===== */
body{
margin:0;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
background:linear-gradient(-45deg,#ff4d88,#ffb3c6,#ffd6e7,#fff);
background-size:400% 400%;
animation:bg 10s infinite;
color:white;
text-align:center;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* ===== CARD ===== */
.card{
width:90%;
max-width:750px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(12px);
padding:30px;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.3);
position:relative;
z-index:2;
}

/* ===== TEXTOS ===== */
h1{
font-size:42px;
margin-bottom:10px;
}

p{
font-size:20px;
line-height:1.6;
}

/* ===== BOTONES ===== */
button{
margin:10px;
padding:14px 28px;
border:none;
border-radius:30px;
cursor:pointer;
font-size:18px;
background:white;
color:#ff2d75;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

/* ===== PASTEL ===== */
#cake{
font-size:120px;
cursor:pointer;
transition:.3s;
}

#cake:active{
transform:scale(1.2);
}

/* ===== VELAS ===== */
.candle{
font-size:30px;
cursor:pointer;
}

/* ===== REGALO ===== */
#gift{
font-size:90px;
display:none;
cursor:pointer;
animation:pop .6s ease;
}

@keyframes pop{
from{transform:scale(0);}
to{transform:scale(1);}
}

/* ===== MENSAJE ===== */
#msg{
display:none;
font-size:22px;
margin-top:15px;
animation:fade 1s;
}

@keyframes fade{
from{opacity:0}
to{opacity:1}
}

/* ===== CORAZONES ===== */
.heart{
position:absolute;
font-size:20px;
animation:up 5s linear forwards;
}

@keyframes up{
0%{transform:translateY(0);opacity:1}
100%{transform:translateY(-120vh);opacity:0}
}

/* ===== CONFETI ===== */
.conf{
position:absolute;
width:8px;
height:8px;
animation:fall 4s linear forwards;
}

@keyframes fall{
to{transform:translateY(100vh) rotate(720deg);}
}

/* ===== INTRO ===== */
#intro{
position:absolute;
width:100%;
height:100%;
background:#ff2d75;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:10;
}

#intro h2{
font-size:40px;
animation:zoom 1.2s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1)}
to{transform:scale(1.1)}
}

/* ===== CONTADOR ===== */
#counter{
position:fixed;
bottom:10px;
right:10px;
background:white;
color:#ff2d75;
padding:10px 15px;
border-radius:20px;
font-weight:bold;
}

/* ===== FLORES ===== */
.flower{
position:absolute;
font-size:22px;
animation:down 6s linear forwards;
}

@keyframes down{
to{transform:translateY(110vh) rotate(360deg);}
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="intro" onclick="start()">
<h2>🎉 Toca para empezar la sorpresa 🎉</h2>
</div>

<!-- TARJETA -->
<div class="card">

<h1>🎂 Feliz Cumpleaños Suegrita Verito🎂</h1>

<p>
Hoy celebramos a una persona muy especial ❤️<br>
Gracias por su cariño, apoyo y amor.
</p>

<div>
<span class="candle">🕯️</span>
<span class="candle">🕯️</span>
<span class="candle">🕯️</span>
</div>

<div id="cake">🎂</div>

<button onclick="regalo()">🎁 Abrir regalo</button>
<button onclick="fiesta()">🎊 Celebrar</button>

<div id="gift">🎁</div>

<div id="msg">
🌹 Feliz cumpleaños suegrita Verito🌹<br><br>
Que Dios la bendiga con salud, cariño y felicidad ❤️
</div>

</div>

<div id="counter">❤️cariño: 0</div>

<script>

let amor=0;

/* intro */
function start(){
document.getElementById("intro").style.display="none";
}

/* contador */
setInterval(()=>{
amor++;
document.getElementById("counter").innerText="❤️ Amor: "+amor;
},1000);

/* velas */
document.querySelectorAll(".candle").forEach(v=>{
v.onclick=()=>v.innerHTML="💨";
});

/* pastel */
document.getElementById("cake").onclick=()=>{
corazones();
fiesta();
}

/* regalo */
function regalo(){
document.getElementById("gift").style.display="block";
document.getElementById("msg").style.display="block";
corazones();
}

/* corazones */
function corazones(){
for(let i=0;i<70;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML=Math.random()>0.5?"❤️":"🌸";
h.style.left=Math.random()*100+"vw";
h.style.top="100vh";
h.style.animationDuration=(3+Math.random()*4)+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),7000);
}
}

/* confeti */
function fiesta(){
for(let i=0;i<120;i++){
let c=document.createElement("div");
c.className="conf";
c.style.left=Math.random()*100+"vw";
c.style.background=`hsl(${Math.random()*360},100%,50%)`;
c.style.animationDuration=(2+Math.random()*3)+"s";
document.body.appendChild(c);
setTimeout(()=>c.remove(),5000);
}
flores();
}

/* flores */
function flores(){
for(let i=0;i<40;i++){
let f=document.createElement("div");
f.className="flower";
f.innerHTML="🌸";
f.style.left=Math.random()*100+"vw";
f.style.animationDuration=(3+Math.random()*4)+"s";
document.body.appendChild(f);
setTimeout(()=>f.remove(),6000);
}
}

</script>

</body>
</html>
