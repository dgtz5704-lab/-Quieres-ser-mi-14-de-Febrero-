<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Para Verito</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
background:linear-gradient(-45deg,#ff4d88,#ffb3c6,#ffd6e7,#fff);
background-size:400% 400%;
animation:bg 10s infinite;
color:white;
text-align:center;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.card{
width:92%;
max-width:700px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(12px);
padding:20px;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.3);
position:relative;
z-index:2;
}

h1{font-size:clamp(26px,5vw,40px);}
p{font-size:clamp(14px,4vw,18px);}

button{
margin:8px;
padding:12px 20px;
border:none;
border-radius:30px;
cursor:pointer;
font-size:16px;
background:white;
color:#ff2d75;
}

button:active{transform:scale(.95)}

#cake{font-size:90px;cursor:pointer;margin:10px 0}

/* INTRO */
#intro{
position:absolute;
width:100%;
height:100%;
background:#ff2d75;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:10;
}

#intro h2{animation:zoom 1.2s infinite alternate}

@keyframes zoom{
from{transform:scale(1)}
to{transform:scale(1.1)}
}

/* MODAL */
#modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.7);
display:none;
justify-content:center;
align-items:center;
z-index:20;
}

#modalContent{
background:white;
color:#ff2d75;
padding:20px;
border-radius:20px;
width:85%;
max-width:350px;
text-align:center;
}

#giftIcon{font-size:80px;cursor:pointer}

/* CORAZONES */
.heart{
position:absolute;
font-size:20px;
animation:up 5s linear forwards;
}

@keyframes up{
0%{transform:translateY(0);opacity:1}
100%{transform:translateY(-120vh);opacity:0}
}

/* CONFETI */
.conf{
position:absolute;
width:8px;
height:8px;
animation:fall 3s linear forwards;
top:-10px;
}

@keyframes fall{
to{transform:translateY(120vh) rotate(720deg);}
}

/* 🐵 MONITO (CORREGIDO) */
#monkey{
position:fixed;
font-size:90px;
cursor:pointer;
display:none;
z-index:999;
user-select:none;
animation:bounce .7s infinite alternate;
}

@keyframes bounce{
from{transform:translateY(0)}
to{transform:translateY(-20px)}
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="intro" onclick="start()">
<h2>🎉 Toca para empezar 🎉</h2>
</div>

<!-- MONITO -->
<div id="monkey" onclick="catchMonkey()">🐵</div>

<!-- MODAL -->
<div id="modal">
<div id="modalContent">
<div id="giftIcon" onclick="openGift()">🎁</div>
<h3>¡Ábreme!</h3>
<button onclick="closeModal()">Cerrar</button>
</div>
</div>

<div class="card">

<h1>🎂 Suegrita Verito 🎂</h1>

<p>
Para la personita especial ❤️<br>
Gracias por su cariño, apoyo y amor.
</p>

<div id="cake">🎂</div>

<button onclick="openModal()">🎁 Abrir regalo</button>
<button onclick="celebrar()">🎊 Celebrar</button>

<h3 id="msg" style="display:none">
🌹 Feliz cumpleaños suegrita Verito 🌹<br>
Te deseo amor, salud y felicidad ❤️
</h3>

</div>

<script>

let puntos=0;

/* inicio */
function start(){
document.getElementById("intro").style.display="none";
spawnMonkey();
}

/* modal */
function openModal(){
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

/* regalo */
function openGift(){
document.getElementById("msg").style.display="block";
closeModal();
corazones();
}

/* pastel */
document.getElementById("cake").onclick=()=>{
openModal();
corazones();
}

/* CELEBRAR */
function celebrar(){
for(let i=0;i<120;i++){
let c=document.createElement("div");
c.className="conf";
c.style.left=Math.random()*100+"vw";
c.style.background=`hsl(${Math.random()*360},100%,50%)`;
c.style.animationDuration=(2+Math.random()*2)+"s";
document.body.appendChild(c);
setTimeout(()=>c.remove(),4000);
}
spawnMonkey();
}

/* CORAZONES */
function corazones(){
for(let i=0;i<40;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML=Math.random()>0.5?"❤️":"🌸";
h.style.left=Math.random()*100+"vw";
h.style.top="100vh";
h.style.animationDuration=(3+Math.random()*3)+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
}
}

/* 🐵 MONITO FIJO Y COMPLETO */
function spawnMonkey(){
let m=document.getElementById("monkey");

m.style.display="block";

/* posición segura (no cortado en pantalla) */
let x = Math.random() * (window.innerWidth - 100);
let y = Math.random() * (window.innerHeight - 120);

m.style.left = x + "px";
m.style.top = y + "px";

/* respawn controlado */
setTimeout(()=>{
if(m.style.display=="block"){
m.style.display="none";
setTimeout(spawnMonkey,1200);
}
},2000);
}

function catchMonkey(){
puntos++;
document.getElementById("monkey").style.display="none";
setTimeout(spawnMonkey,800);
}

</script>

</body>
</html>
